name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed build and GitHub Release
    runs-on: ubuntu-22.04
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      CIQ_AGREEMENT_HASH: ${{ secrets.CIQ_AGREEMENT_HASH }}
      CIQ_SIGNING_KEY_B64: ${{ secrets.CIQ_SIGNING_KEY_B64 }}
      CIQ_SDK_VERSION: "9.2.0"
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches BUILD_ID and CHANGELOG
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          build_id="$(sed -n 's/.*const BUILD_ID = "\(.*\)";.*/\1/p' source/PauseGuardianSession.mc)"
          if [ "$tag" != "v$build_id" ]; then
            echo "::error::Tag $tag does not match BUILD_ID $build_id."
            exit 1
          fi
          if ! grep -qF "## [$build_id]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $build_id."
            exit 1
          fi
          echo "version=$build_id" >> "$GITHUB_OUTPUT"

      - name: Required secrets are set
        run: |
          missing=""
          for name in GARMIN_USERNAME GARMIN_PASSWORD CIQ_AGREEMENT_HASH CIQ_SIGNING_KEY_B64; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Connect IQ SDK and devices
        run: |
          go install github.com/lindell/connect-iq-sdk-manager-cli@latest
          manager="$(go env GOPATH)/bin/connect-iq-sdk-manager-cli"
          "$manager" agreement accept --acceptance-hash="$CIQ_AGREEMENT_HASH"
          "$manager" login
          "$manager" sdk set "$CIQ_SDK_VERSION"
          "$manager" device download --manifest=manifest.xml
          "$manager" sdk current-path --bin >> "$GITHUB_PATH"

      - name: Restore signing key
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          echo "$CIQ_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/key/developer_key.der"

      - name: Signed release build and package
        run: |
          monkeyc -d instinct2 -f monkey.jungle -o bin/PauseGuardian.prg \
            -y "$RUNNER_TEMP/key/developer_key.der" -w -r -O 2z -l 1
          monkeyc -f monkey.jungle -o bin/PauseGuardian.iq \
            -y "$RUNNER_TEMP/key/developer_key.der" -w -r -e -O 2z -l 1
          (cd bin && sha256sum PauseGuardian.prg PauseGuardian.iq > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(awk -v header="## [$VERSION]" '
            index($0, header) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}' CHANGELOG.md)"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "Pause Guardian $VERSION" \
            --notes "$notes" \
            bin/PauseGuardian.prg bin/PauseGuardian.iq bin/SHA256SUMS.txt
